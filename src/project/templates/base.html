{% spaceless %}

{% load static %}

<html lang="en">{% endspaceless %}
<head>
    <meta charset="utf-8">
    <title>Этот язык</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        line-height: 1.5rem;
      }

      .container {
        position: relative;
        width: 1128px;
        box-sizing: border-box;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 96px;
        padding-top: 42px;
      }

      .one-column {
        text-align: center;
      }

      .step-title {
        margin-top: 128px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        color: rgba(0, 0, 0, 0.38);
        font-weight: 900;
      }

      .error-block__text {
        font-size: 1.25rem;
        color: rgba(0, 0, 0, 0.54);
        line-height: 2rem;
        margin-bottom: 48px;
      }

      .error-block__title {
        font-size: 4rem;
        margin-bottom: 48px;
      }

      button {
        height: 48px;
        padding-left: 32px;
        padding-right: 32px;
        background-color: rgb(255, 152, 0);
        color: white;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.75px;
        border: none;
        border-radius: 4px;
        box-shadow: 0px 3px 1px -2px rgba(0, 0, 0, 0.2),
          0px 2px 2px 0px rgba(0, 0, 0, 0.14),
          0px 1px 5px 0px rgba(0, 0, 0, 0.12);
        cursor: pointer;
      }

      button:active,
      button:focus {
        outline: none;
      }

      @media(max-width: 800px) {
        .container {
          width: 100%;
          padding-top: 24px;
          padding-left: 16px;
          padding-right: 16px;
        }

        .one-column,
        .step-title {
          text-align: left;
        }

        .step-title {
          margin-top: 24px;
          margin-bottom: 8px;
          font-size: 12px;
        }

        .error-block__title {
          margin-top: 8px;
          margin-bottom: 16px;
          font-size: 34px;
          line-height: 40px;
        }

        .error-block__text {
          margin-bottom: 24px;
          font-size: 16px;
          line-height: 28px;
        }
      }

    </style>
</head>
<body>
<div id="root">
    <div class="container">
        {% block content %}

        {% endblock %}
    </div>
</div>
{% block more_scripts %}{% endblock %}
</body>
</html>
